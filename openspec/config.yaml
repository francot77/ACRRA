rules:
  proposal:
    - Keep proposals aligned to the current empty-repo baseline and sample JSON inputs.
    - State assumptions explicitly when introducing the first application structure.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHOULD, MAY).
  design:
    - Explain new runtime boundaries because no architecture exists yet.
    - Record storage, file-watch, and webhook tradeoffs explicitly.
  tasks:
    - Keep tasks completable in one session.
    - Flag delivery slices that may exceed the 400-line review budget.
  apply:
    - Follow existing patterns once established; until then, prefer minimal structure.
    - Chained PR strategy is ask-always when work exceeds review budget.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
