schema: spec-driven

context: |
  Project: MotassettoRR
  Current state: bootstrap repository with Assetto Corsa result samples only
  Domain: race result monitoring and processing from JSON session exports
  Detected stack: no application runtime or source code configured yet
  Architecture: not established yet
  Testing: no test runner or quality tool configured yet
  Planned MVP context: ac-race-monitor in Node.js/TypeScript with Docker, SQLite, chokidar, dotenv, Discord webhook
  Data examples: samples/results/*.json with QUALIFY and RACE payloads

strict_tdd: false

testing:
